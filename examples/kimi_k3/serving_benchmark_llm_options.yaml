# Full LLM configuration for run_serving_benchmark_kimi_k3.sbatch. These
# settings match the old launcher's inline config and command-line overrides.
tensor_parallel_size: 16
enable_attention_dp: true
moe_expert_parallel_size: 16
max_batch_size: 32
max_num_tokens: 8192
max_seq_len: 9344
trust_remote_code: true
disable_overlap_scheduler: false
cuda_graph_config:
  max_batch_size: 32
enable_chunked_prefill: true
kv_cache_config:
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.25
